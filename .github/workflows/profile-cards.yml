# Regenerates the stats, languages and contribution-snake cards used in README.md.
# Everything is rendered here and committed to /profile, so the README never depends
# on a public card service being up (the old github-readme-stats.vercel.app instance is paused).
#
# Optional: add a classic Personal Access Token (scopes: repo, read:user) as the repo
# secret STATS_TOKEN to include private-repo commits and languages. Without it the
# cards show public activity only.

name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 06:17 Amman time
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&hide_border=true&border_radius=14&bg_color=0B0B0C&title_color=FF7A1F&icon_color=FF7A1F&text_color=D6D5D0&custom_title=GitHub%20Stats&card_width=420
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide_border=true&border_radius=14&bg_color=0B0B0C&title_color=FF7A1F&text_color=D6D5D0&custom_title=Most%20Used%20Languages&card_width=360
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?color_snake=#FF7A1F&color_dots=#EBEBE6,#FFD7B8,#FFB27A,#FF8C3A,#E4600A
            profile/snake-dark.svg?palette=github-dark&color_snake=#FF7A1F&color_dots=#161618,#4A2812,#8A4417,#CC6119,#FF7A1F

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git push
